<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VINIBALL - Catálogos CIPSA</title>
  <meta name="description" content="Catálogo VINIBALL: Pelotas y sistemas de contención deportiva. 76 páginas de productos CIPSA.">
  <meta name="author" content="Carlos Cusi - G360">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#2ECC71">
  <meta property="og:title" content="VINIBALL - Catálogos CIPSA 2026">
  <meta property="og:description" content="Pelotas y sistemas de contención deportiva. 76 páginas.">
  <meta property="og:image" content="images/viniball/cover.webp">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="G360 CIPSA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VINIBALL - Catálogos CIPSA">
  <meta name="twitter:description" content="Pelotas y sistemas de contención deportiva.">
  <meta name="twitter:image" content="images/viniball/cover.webp">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flipbook.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <style>
    :root { --catalog-accent: #2ECC71; --catalog-glow: rgba(46,204,113,0.4); --catalog-gradient: linear-gradient(135deg, #0a2d0a 0%, #0d1117 50%, #051a05 100%); }
  </style>
</head>
<body>
  <div class="flipbook-wrapper">
    <header class="flipbook-header">
      <div class="flipbook-header-logo">
        <a href="index.html"><img src="assets/brand/logo-cipsa.svg" alt="CIPSA"></a>
      </div>
      <a href="index.html" class="flipbook-btn">← Biblioteca</a>
    </header>
    <div class="flipbook-container">
      <div class="flipbook-inner">
        <div id="book"></div>
        <div class="watermark">
          <img src="assets/brand/logo-cipsa.svg" alt="CIPSA">
          <span data-year="range">2026 - 2027</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="toolbar-btn" id="btnPrev" aria-label="Anterior">←</button>
    <button class="toolbar-btn" id="btnNext" aria-label="Siguiente">→</button>
    <input type="range" class="toolbar-slider" id="pageSlider" min="1" max="76" value="1" aria-label="Navegar páginas">
    <div class="page-nav">
      <input type="number" class="page-input" id="pageInput" min="1" max="76" value="1" inputmode="numeric" aria-label="Ir a página">
      <span class="page-total" id="pageTotal">/ 76</span>
    </div>
    <span class="toolbar-sep"></span>
    <button class="toolbar-btn" id="btnIndex" aria-label="Índice">☰</button>
    <button class="toolbar-btn zoom-toolbar-btn" id="magZoomOut" aria-label="Reducir zoom">−</button>
    <span class="zoom-level-badge" id="magLevel">1x</span>
    <button class="toolbar-btn zoom-toolbar-btn" id="magZoomIn" aria-label="Aumentar zoom">+</button>
    <button class="toolbar-btn" id="btnMagnifier" aria-label="Activar lupa">🔍</button>
    <button class="toolbar-btn" id="thumbsBtn" aria-label="Miniaturas">▦</button>
    <button class="toolbar-btn" id="btnFullscreen" aria-label="Pantalla completa">⛶</button>
    <button class="toolbar-btn" id="btnShare" aria-label="Compartir página">🔗</button>
    <button class="toolbar-btn" id="btnAudio" aria-label="Sonido">🔊</button>
  </div>

  <div class="index-panel" id="indexPanel">
    <h4>Índice</h4>
    <div id="indexList"></div>
  </div>

  <div class="magnifier" id="magnifier" role="dialog" aria-label="Lupa de ampliación">
    <div class="magnifier-header">
      <span class="magnifier-caption">Inspección</span>
      <button class="magnifier-btn" id="magCapture" aria-label="Capturar imagen de la lupa" title="Capturar para pedido">📷</button>
      <button class="magnifier-btn magnifier-close" id="magClose" aria-label="Cerrar lupa">×</button>
    </div>
    <div class="magnifier-viewport" id="magnifierViewport">
      <span class="magnifier-pin-hint">📌 Fijar posición</span>
      <img class="magnifier-img" id="magnifierImg" alt="Vista ampliada" draggable="false">
    </div>
  </div>

  <div class="thumbnails-panel" id="thumbsPanel">
    <h4>Ir a página</h4>
    <div class="thumbs-progress"><div class="thumbs-progress-bar" id="thumbsProgress"></div></div>
    <div class="thumbnails-grid" id="thumbsGrid"></div>
  </div>

  <script type="module">
    import { initFlipbook } from './js/flipbook-ui.js';
    import { applyReactiveYear } from './js/year.js';
    applyReactiveYear();
    initFlipbook({ theme: 'viniball' });
  </script>
</body>
</html>
