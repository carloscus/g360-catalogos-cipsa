<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDUSTRIALES - Catálogos CIPSA</title>
  <meta name="description" content="Catálogo INDUSTRIALES: Soluciones industriales para empresas. 10 páginas de productos CIPSA.">
  <meta name="author" content="Carlos Cusi - G360">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#F39C12">
  <meta property="og:title" content="INDUSTRIALES - Catálogos CIPSA 2026">
  <meta property="og:description" content="Soluciones industriales para empresas. 10 páginas.">
  <meta property="og:image" content="images/industriales/cover.jpg">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="G360 CIPSA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="INDUSTRIALES - Catálogos CIPSA">
  <meta name="twitter:description" content="Soluciones industriales para empresas.">
  <meta name="twitter:image" content="images/industriales/cover.jpg">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/flipbook.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <style>
    :root { --catalog-accent: #F39C12; --catalog-glow: rgba(243,156,18,0.4); --catalog-gradient: linear-gradient(135deg, #2d200a 0%, #0d1117 50%, #1a1505 100%); }
  </style>
</head>
<body>
  <div class="flipbook-wrapper">
    <header class="flipbook-header">
      <div class="flipbook-header-logo">
        <a href="index.html"><img src="assets/brand/logo-cipsa.svg" alt="CIPSA"></a>
      </div>
      <div class="flipbook-controls">
        <button class="flipbook-btn" id="btnPrev">← Anterior</button>
        <div class="page-nav">
          <input type="number" class="page-input" id="pageInput" min="1" max="10" value="1" inputmode="numeric" aria-label="Ir a página">
          <span class="page-total" id="pageTotal">/ 10</span>
        </div>
        <button class="flipbook-btn" id="btnNext">Siguiente →</button>
        <a href="index.html" class="flipbook-btn">← Biblioteca</a>
        <button class="audio-toggle" id="btnAudio" aria-label="Toggle audio">🔊</button>
      </div>
    </header>
    <div class="flipbook-container">
      <div id="book"></div>
    </div>
  </div>

  <div class="magnifier" id="magnifier" role="dialog" aria-label="Lupa de ampliación">
    <img class="magnifier-img" id="magnifierImg" alt="Vista ampliada" draggable="false">
    <div class="magnifier-toolbar">
      <button class="magnifier-btn" id="magZoomOut" aria-label="Reducir zoom de lupa">−</button>
      <span class="magnifier-level" id="magLevel">1x</span>
      <button class="magnifier-btn" id="magZoomIn" aria-label="Aumentar zoom de lupa">+</button>
      <button class="magnifier-btn magnifier-close" id="magClose" aria-label="Cerrar lupa">×</button>
    </div>
  </div>

  <div class="thumbs-hint" id="thumbsHint" role="button" tabindex="0" aria-label="Ver páginas">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    <span>Ver páginas</span>
  </div>

  <button class="thumbnails-btn" id="thumbsBtn" aria-label="Miniaturas">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
  </button>
  <div class="thumbnails-panel" id="thumbsPanel">
    <h4>Ir a página</h4>
    <div class="thumbs-progress"><div class="thumbs-progress-bar" id="thumbsProgress"></div></div>
    <div class="thumbnails-grid" id="thumbsGrid"></div>
  </div>

  <script type="module">
    import { initFlipbook } from './js/flipbook-ui.js';
    import { applyReactiveYear } from './js/year.js';
    applyReactiveYear();
    initFlipbook({ theme: 'industriales' });
  </script>
</body>
</html>
