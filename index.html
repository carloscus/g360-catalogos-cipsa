<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogos CIPSA 2026 - 2027</title>
  <meta name="description" content="Estante digital de catálogos CIPSA: VINIFAN, VINIBALL, Representadas, Institucional e Industriales. Explora nuestra línea completa de productos con flipbook interactivo.">
  <meta name="author" content="Carlos Cusi - G360">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#00d084">
  <meta property="og:title" content="Catálogos CIPSA 2026 - 2027">
  <meta property="og:description" content="Estante digital de catálogos CIPSA con flipbook interactivo. VINIFAN, VINIBALL, Representadas, Institucional e Industriales.">
  <meta property="og:image" content="images/vinifan/cover.jpg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="G360 CIPSA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Catálogos CIPSA 2026 - 2027">
  <meta name="twitter:description" content="Estante digital de catálogos CIPSA con flipbook interactivo.">
  <meta name="twitter:image" content="images/vinifan/cover.jpg">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
  <header class="header">
    <div class="header-logo">
      <img src="assets/brand/logo-cipsa.svg" alt="CIPSA Logo">
    </div>
    <div class="header-controls">
      <button class="btn-control" id="btnAudio" aria-label="Toggle audio">
        <span id="audioIcon">🔊</span>
      </button>
    </div>
  </header>
  <section class="hero">
    <h1>Catálogos CIPSA <span data-year="range">2026 - 2027</span></h1>
    <p>Explora nuestra línea completa de productos industriales y representadas</p>
  </section>
  <main class="regleta-container">
    <p class="regleta-label">Nuestros Catálogos</p>
    <div class="regleta" id="regleta"></div>
  </main>
  <footer class="footer">
    <p>powered by <a href="https://g360.ecosystem" target="_blank">G360</a> &copy; CIPSA <span data-year="year">2026</span></p>
  </footer>
  <script type="module">
    import { CATALOGS_CONFIG } from './js/config.js';
    import { audioSystem } from './js/audio.js';
    import { applyReactiveYear } from './js/year.js';
    applyReactiveYear();
    const regleta = document.getElementById('regleta');
    const btnAudio = document.getElementById('btnAudio');
    const audioIcon = document.getElementById('audioIcon');
    btnAudio.addEventListener('click', () => {
      const muted = audioSystem.toggleMute();
      audioIcon.textContent = muted ? '🔇' : '🔊';
    });
    function createCatalogCard(catId) {
      const config = CATALOGS_CONFIG[catId];
      if (!config) return null;
      const card = document.createElement('a');
      card.className = 'catalog-card';
      const numMap = { vinifan: 1, viniball: 2, industriales: 5, representadas: 3, institucional: 4 };
      card.href = `catalogo-${numMap[catId]}.html`;
      card.target = '_blank';
      card.rel = 'noopener';
      card.innerHTML = `
        <div class="catalog-card-cover">
          <img src="images/${catId}/cover.jpg" alt="Portada ${config.name}" loading="lazy">
        </div>
        <div class="catalog-card-info">
          <h3 class="catalog-card-title">${config.name}</h3>
          <p class="catalog-card-desc">${config.description}</p>
          <span class="catalog-card-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Ver catálogo
          </span>
        </div>`;
      card.addEventListener('mouseenter', () => audioSystem.play('hover'));
      return card;
    }
    const themes = ['vinifan', 'viniball', 'representadas', 'institucional', 'industriales'];
    themes.forEach(t => { const c = createCatalogCard(t); if (c) regleta.appendChild(c); });
  </script>
</body>
</html>
